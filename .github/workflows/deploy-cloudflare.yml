name: Deploy Peek to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peek-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify deployment secrets
        shell: bash
        env:
          INFINISYNAPSE_API_KEY: ${{ secrets.INFINISYNAPSE_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$INFINISYNAPSE_API_KEY" || (echo "Missing INFINISYNAPSE_API_KEY" && exit 1)

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Find or create production D1 database
        shell: bash
        run: |
          DB_ID="$(pnpm exec wrangler d1 list --json | jq -r '.[] | select(.name == "xianjian-d1") | (.uuid // .id)' | head -n 1)"
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            CREATE_OUTPUT="$(pnpm exec wrangler d1 create xianjian-d1 --location=apac 2>&1)"
            printf '%s\n' "$CREATE_OUTPUT"
            DB_ID="$(printf '%s\n' "$CREATE_OUTPUT" | sed -n 's/.*database_id = "\([^"]*\)".*/\1/p' | head -n 1)"
          fi
          test -n "$DB_ID" || (echo "Unable to resolve D1 database id" && exit 1)
          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Bind D1 database
        shell: bash
        run: |
          node -e "const fs=require('fs'); const p='wrangler.toml'; let s=fs.readFileSync(p,'utf8'); s=s.replace('REPLACE_WITH_YOUR_D1_DATABASE_ID', process.env.D1_DATABASE_ID); fs.writeFileSync(p,s);"

      - name: Build and test
        run: pnpm test

      - name: Deploy public Worker
        run: pnpm exec wrangler deploy

      - name: Configure InfiniSynapse secret
        shell: bash
        env:
          INFINISYNAPSE_API_KEY: ${{ secrets.INFINISYNAPSE_API_KEY }}
        run: printf '%s' "$INFINISYNAPSE_API_KEY" | pnpm exec wrangler secret put INFINISYNAPSE_API_KEY
